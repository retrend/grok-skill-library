<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Library — Grok Bot</title>
  <meta name="description" content="Searchable library of Grok Bot skills gathered via Tweet → Skill." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js" defer></script>
  <script src="app.js" defer></script>
  <script type="module" src="ask.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>Skill Library</h1>
          <p class="brand-sub">Grok Bot · Tweet → Skill</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-accent" id="btn-ask" title="Ask your skills (a)" aria-expanded="false">Ask ✦</button>
        <button type="button" class="btn btn-ghost" id="btn-random" title="Random skill (r)">Random</button>
        <span class="status" id="status" aria-live="polite">Loading…</span>
      </div>
    </header>

    <section class="controls" aria-label="Search and filters">
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Search skills…  (press /)" autocomplete="off" spellcheck="false" />
        <kbd class="kbd-hint">/</kbd>
      </div>
      <div class="sort-wrap">
        <label for="sort" class="sr-only">Sort</label>
        <select id="sort">
          <option value="newest">Newest</option>
          <option value="az">A–Z</option>
          <option value="longest">Longest</option>
        </select>
      </div>
    </section>

    <section class="chips" id="chips" aria-label="Tag filters"></section>

    <main class="grid" id="grid" tabindex="-1"></main>

    <div class="empty" id="empty" hidden>
      <div class="empty-inner">
        <p class="empty-title">No matching skills</p>
        <p class="empty-body">Try a different search, or clear the tag filters.</p>
        <button type="button" class="btn btn-accent" id="btn-clear">Clear filters</button>
      </div>
    </div>
  </div>

  <!-- Detail slide-over -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <div class="detail-toolbar">
      <button type="button" class="btn btn-ghost btn-icon" id="btn-prev" title="Previous (← / k)" aria-label="Previous skill">‹</button>
      <button type="button" class="btn btn-ghost btn-icon" id="btn-next" title="Next (→ / j)" aria-label="Next skill">›</button>
      <div class="detail-spacer"></div>
      <button type="button" class="btn btn-ghost" id="btn-copy" title="Copy as Markdown">Copy MD</button>
      <button type="button" class="btn btn-ghost btn-icon" id="btn-close" title="Close (Esc)" aria-label="Close">×</button>
    </div>
    <div class="detail-scroll" id="detail-body">
      <!-- filled by JS -->
    </div>
  </aside>

  <!-- Ask chat panel -->
  <aside class="ask-panel" id="ask-panel" aria-label="Ask your skills" hidden>
    <div class="ask-head">
      <div><strong>Ask your skills</strong> <span class="ask-mode" id="ask-mode"></span></div>
      <div>
        <button type="button" class="btn btn-ghost" id="ask-reset" title="New chat">New chat</button>
        <button type="button" class="btn btn-ghost btn-icon" id="ask-close" aria-label="Close">×</button>
      </div>
    </div>
    <div class="ask-log" id="ask-log" aria-live="polite"></div>
    <div class="ask-suggest" id="ask-suggest">
      <button type="button">How do I get cited in AI search?</button>
      <button type="button">How should I run UGC ads?</button>
      <button type="button">How do I find warm outbound leads?</button>
      <button type="button">How do I make agents verify their work?</button>
    </div>
    <form class="ask-form" id="ask-form">
      <input id="ask-input" type="text" placeholder="Ask a question…" autocomplete="off" />
      <button type="submit" class="btn btn-accent">Send</button>
    </form>
    <p class="ask-note">Runs in your browser. No AI service, no data leaves the page.</p>
  </aside>

  <div class="toast" id="toast" hidden role="status"></div>
</body>
</html>
